# Prepared only. Approve the workspace, region, plan and environment before use.
# Existing web services and the shared event database remain separately managed.
services:
  - type: web
    name: todoevents-plugin
    runtime: docker
    dockerfilePath: ./Dockerfile.plugin
    dockerContext: .
    autoDeployTrigger: "off"
    healthCheckPath: /health
    envVars:
      - key: PLUGIN_ENV
        value: production
      - key: PLUGIN_DATABASE_URL
        sync: false
      - key: PLUGIN_RESOURCE_URL
        sync: false
      - key: PLUGIN_OAUTH_ISSUER
        sync: false
      - key: PLUGIN_OAUTH_AUDIENCE
        sync: false
      - key: PLUGIN_OAUTH_JWKS_URL
        sync: false
      - key: PLUGIN_UI_DOMAIN
        sync: false
      # Optional: add only after verifying the hosting provider's exact trusted
      # ingress IPs/CIDRs and forwarded-header handling. Never use a wildcard.
      # Without this, clients behind the same proxy share its request allowance.
      # - key: PLUGIN_TRUSTED_PROXY_IPS
      #   sync: false
